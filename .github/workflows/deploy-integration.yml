name: integration

on:
  push:
    branches: [integration]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump for this deployment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: integration-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_FRONTEND_SERVICE }}
  BACKEND_API_BASE_URL: ${{ vars.BACKEND_API_BASE_URL }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  IMAGE_NAME: frontend/web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitHub configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          required_vars=(
            PROJECT_ID
            REGION
            ARTIFACT_REPOSITORY
            SERVICE_NAME
            BACKEND_API_BASE_URL
            GOOGLE_CLIENT_ID
            GCP_SA_KEY
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub variable or secret: ${name}"
              exit 1
            fi
          done

      - name: Normalize deployment variables
        run: |
          trim_value() {
            printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          {
            echo "PROJECT_ID=$(trim_value "${PROJECT_ID}")"
            echo "REGION=$(trim_value "${REGION}")"
            echo "ARTIFACT_REPOSITORY=$(trim_value "${ARTIFACT_REPOSITORY}")"
            echo "SERVICE_NAME=$(trim_value "${SERVICE_NAME}")"
            echo "BACKEND_API_BASE_URL=$(trim_value "${BACKEND_API_BASE_URL}")"
            echo "GOOGLE_CLIENT_ID=$(trim_value "${GOOGLE_CLIENT_ID}")"
          } >> "$GITHUB_ENV"

      - name: Resolve app version
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          bump="${MANUAL_BUMP:-}"

          if [ -z "${bump}" ]; then
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '.[0].labels[].name' 2>/dev/null || true)"

            if printf '%s\n' "${labels}" | grep -Eiq '(^|:|/|-)major$|^major$'; then
              bump="major"
            elif printf '%s\n' "${labels}" | grep -Eiq '(^|:|/|-)minor$|^minor$'; then
              bump="minor"
            elif printf '%s\n' "${labels}" | grep -Eiq '(^|:|/|-)patch$|^patch$'; then
              bump="patch"
            else
              bump="patch"
            fi
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "${latest_tag}" ]; then
            next_version="1.0.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version}"

            case "${bump}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "::error::Invalid version bump: ${bump}"
                exit 1
                ;;
            esac

            next_version="${major}.${minor}.${patch}"
          fi

          {
            echo "VERSION_BUMP=${bump}"
            echo "APP_VERSION=${next_version}"
            echo "APP_VERSION_TAG=v${next_version}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE_BASE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_URI_LATEST="${IMAGE_BASE_URI}:latest"
          IMAGE_URI_VERSION="${IMAGE_BASE_URI}:${APP_VERSION_TAG}"

          docker build \
            --build-arg VITE_API_BASE_URL="${BACKEND_API_BASE_URL}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            -t "${IMAGE_URI_LATEST}" \
            -t "${IMAGE_URI_VERSION}" \
            .

          {
            echo "IMAGE_URI=${IMAGE_URI_VERSION}"
            echo "IMAGE_URI_LATEST=${IMAGE_URI_LATEST}"
            echo "IMAGE_URI_VERSION=${IMAGE_URI_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Push image
        run: |
          docker push "${IMAGE_URI_LATEST}"
          docker push "${IMAGE_URI_VERSION}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format "value(status.url)"

      - name: Create GitHub version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${APP_VERSION_TAG}" -m "integration ${APP_VERSION_TAG} (${VERSION_BUMP})"
          git push origin "${APP_VERSION_TAG}"

      - name: Show Cloud Run logs on failure
        if: failure()
        run: |
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --limit 50 \
            --format "value(timestamp,severity,textPayload)"
